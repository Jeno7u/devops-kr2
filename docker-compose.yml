services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kr2-app:1.0
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      STUDENT: Mironov
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8004:8004"
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is not set}"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    driver: bridge
    internal: true

volumes:
  redis_data:
